<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GAS × LINE@ 十大功能系統完全手冊</title>
<style>
:root{--bg:#0a0c12;--s1:#111520;--s2:#181c2a;--s3:#1e2338;--primary:#4F46E5;--pri2:#818CF8;--cyan:#06B6D4;--green:#10B981;--yellow:#F59E0B;--pink:#EC4899;--red:#EF4444;--text:#F1F5F9;--muted:#64748B;--soft:#94A3B8;--border:#1e2338;--border2:#2a3050;}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;overflow-x:hidden;}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px;}

/* NAV */
#nav{position:fixed;top:0;left:0;right:0;z-index:300;background:rgba(10,12,18,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;padding:0 24px;gap:16px;}
.nav-logo{font-size:14px;font-weight:800;background:linear-gradient(135deg,#818CF8,#06B6D4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap;}
.nav-tabs{display:flex;gap:4px;overflow-x:auto;flex:1;}
.nav-tabs::-webkit-scrollbar{height:0;}
.ntab{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap;border:none;background:none;transition:all .2s;}
.ntab:hover,.ntab.on{background:rgba(79,70,229,.15);color:var(--pri2);}

/* HERO */
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:80px 24px 60px;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(79,70,229,.2),transparent);}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(79,70,229,.15);border:1px solid rgba(79,70,229,.3);color:var(--pri2);padding:5px 16px;border-radius:30px;font-size:12px;font-weight:700;margin-bottom:20px;}
.hero h1{font-size:clamp(28px,5vw,56px);font-weight:900;line-height:1.1;margin-bottom:16px;}
.grad{background:linear-gradient(135deg,#818CF8,#06B6D4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero-sub{font-size:15px;color:var(--soft);max-width:540px;margin:0 auto 32px;}
.stat-row{display:flex;gap:32px;justify-content:center;flex-wrap:wrap;margin-top:40px;}
.stat{text-align:center;}.stat-n{font-size:26px;font-weight:800;}.stat-l{font-size:11px;color:var(--muted);}
.s-blue .stat-n{color:#818CF8;}.s-cyan .stat-n{color:#06B6D4;}.s-green .stat-n{color:#10B981;}.s-pink .stat-n{color:#EC4899;}

/* INDEX GRID */
.idx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding:0 24px;max-width:1200px;margin:0 auto 80px;}
.idx-card{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:18px;cursor:pointer;transition:all .25s;display:flex;gap:14px;align-items:flex-start;}
.idx-card:hover{border-color:var(--border2);transform:translateY(-2px);}
.idx-card.creative{border-color:rgba(245,158,11,.25);background:rgba(245,158,11,.04);}
.idx-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.idx-n{font-size:10px;font-weight:700;color:var(--muted);margin-bottom:2px;}
.idx-t{font-size:13px;font-weight:700;margin-bottom:3px;}
.idx-d{font-size:11px;color:var(--soft);}
.creative-tag{display:inline-flex;align-items:center;gap:4px;background:rgba(245,158,11,.15);color:#FCD34D;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;margin-top:4px;}

/* SYSTEM PAGE */
.sys-page{display:none;padding:80px 24px 60px;max-width:1000px;margin:0 auto;}
.sys-page.active{display:block;}
.sys-hero{background:var(--s1);border:1px solid var(--border);border-radius:20px;padding:36px;margin-bottom:32px;position:relative;overflow:hidden;}
.sys-hero-bg{position:absolute;inset:0;opacity:.06;font-size:200px;display:flex;align-items:center;justify-content:flex-end;padding-right:20px;pointer-events:none;}
.sys-badge{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:12px;}
.sys-h1{font-size:clamp(22px,3vw,32px);font-weight:900;margin-bottom:8px;}
.sys-sub{font-size:14px;color:var(--soft);max-width:600px;margin-bottom:20px;}
.tag-row{display:flex;gap:8px;flex-wrap:wrap;}
.tag{padding:3px 12px;border-radius:20px;font-size:11px;font-weight:600;}
.t-blue{background:rgba(79,70,229,.15);color:#818CF8;}
.t-cyan{background:rgba(6,182,212,.15);color:#67E8F9;}
.t-green{background:rgba(16,185,129,.15);color:#6EE7B7;}
.t-yellow{background:rgba(245,158,11,.15);color:#FCD34D;}
.t-pink{background:rgba(236,72,153,.15);color:#F9A8D4;}
.t-red{background:rgba(239,68,68,.15);color:#FCA5A5;}

/* FLOW DIAGRAM */
.flow{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin:16px 0;padding:20px;background:var(--s2);border-radius:12px;justify-content:center;}
.flow-node{background:var(--s3);border:1px solid var(--border2);border-radius:10px;padding:8px 14px;font-size:12px;font-weight:600;text-align:center;white-space:nowrap;}
.flow-arr{color:var(--muted);font-size:18px;padding:0 6px;}
.flow-node.n-line{border-color:rgba(6,182,212,.4);color:#67E8F9;}
.flow-node.n-gas{border-color:rgba(16,185,129,.4);color:#6EE7B7;}
.flow-node.n-sheet{border-color:rgba(245,158,11,.4);color:#FCD34D;}
.flow-node.n-user{border-color:rgba(79,70,229,.4);color:#818CF8;}

/* SECTIONS */
.sec{margin-bottom:32px;}
.sec-title{font-size:16px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.sec-title::before{content:'';width:3px;height:18px;background:linear-gradient(to bottom,#4F46E5,#06B6D4);border-radius:2px;display:block;}

/* STEPS */
.steps{display:flex;flex-direction:column;gap:0;}
.step-item{display:flex;gap:16px;}
.step-left{display:flex;flex-direction:column;align-items:center;}
.step-num{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;}
.step-line{flex:1;width:2px;background:var(--border);margin:4px 0;}
.step-body{flex:1;padding-bottom:24px;}
.step-t{font-size:14px;font-weight:700;margin-bottom:4px;}
.step-d{font-size:13px;color:var(--soft);line-height:1.6;}

/* CODE */
.code-block{background:#0d1117;border:1px solid var(--border2);border-radius:12px;overflow:hidden;margin:12px 0;}
.code-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--s2);border-bottom:1px solid var(--border);}
.code-lang{font-size:11px;font-weight:700;color:var(--soft);}
.copy-btn{padding:4px 12px;border-radius:6px;border:1px solid var(--border2);background:none;color:var(--soft);font-size:11px;cursor:pointer;transition:all .2s;}
.copy-btn:hover{background:var(--s3);color:var(--text);}
pre{padding:16px;overflow-x:auto;font-size:12px;line-height:1.7;font-family:'Consolas','Courier New',monospace;}
.k{color:#FF79C6;}.f{color:#50FA7B;}.s{color:#F1FA8C;}.c{color:#6272A4;font-style:italic;}.v{color:#BD93F9;}.n{color:#8BE9FD;}.o{color:#FF5555;}

/* INFO BOXES */
.box{border-radius:10px;padding:14px 18px;margin:12px 0;border-left:3px solid;}
.box-info{background:rgba(6,182,212,.06);border-color:var(--cyan);}
.box-warn{background:rgba(245,158,11,.06);border-color:var(--yellow);}
.box-ok{background:rgba(16,185,129,.06);border-color:var(--green);}
.box-tip{background:rgba(79,70,229,.06);border-color:var(--primary);}
.box-title{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;}
.box-info .box-title{color:#67E8F9;}.box-warn .box-title{color:#FCD34D;}.box-ok .box-title{color:#6EE7B7;}.box-tip .box-title{color:#818CF8;}
.box p,.box li{font-size:13px;color:var(--soft);}
.box ul{padding-left:16px;}

/* TABLE */
.tbl-wrap{overflow-x:auto;margin:12px 0;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--s2);padding:9px 14px;text-align:left;font-weight:700;color:var(--text);}
td{padding:9px 14px;border-bottom:1px solid var(--border);color:var(--soft);}
tr:hover td{background:rgba(255,255,255,.02);}

/* PROFIT CARD */
.profit-card{background:linear-gradient(135deg,rgba(245,158,11,.1),rgba(236,72,153,.08));border:1px solid rgba(245,158,11,.25);border-radius:16px;padding:24px;margin-top:24px;}
.profit-title{font-size:15px;font-weight:800;color:#FCD34D;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.profit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;}
.profit-item{background:rgba(0,0,0,.3);border-radius:10px;padding:14px;text-align:center;}
.profit-num{font-size:20px;font-weight:800;color:#FCD34D;}
.profit-label{font-size:11px;color:var(--muted);margin-top:2px;}

/* BACK BTN */
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:8px;border:1px solid var(--border2);background:none;color:var(--soft);font-size:13px;cursor:pointer;transition:all .2s;margin-bottom:24px;}
.back-btn:hover{background:var(--s2);color:var(--text);}
.sys-nav{display:flex;justify-content:space-between;margin-top:48px;padding-top:24px;border-top:1px solid var(--border);}
.btn{padding:9px 20px;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-p{background:linear-gradient(135deg,var(--primary),var(--cyan));color:#fff;}
.btn-p:hover{opacity:.9;}
.btn-g{background:none;border:1px solid var(--border2);color:var(--soft);}
.btn-g:hover{background:var(--s2);color:var(--text);}

@media(max-width:640px){.idx-grid{grid-template-columns:1fr 1fr;padding:0 16px;}.sys-page{padding:70px 16px 40px;}.flow{gap:4px;}}
</style>
</head>
<body>

<div id="nav">
  <div class="nav-logo">⚙️ GAS × LINE@</div>
  <div class="nav-tabs" id="nav-tabs">
    <button class="ntab on" onclick="showHome()">總覽</button>
  </div>
</div>

<!-- HOME -->
<div id="home-page">
<div class="hero">
  <div>
    <div class="hero-badge">🔧 Google Apps Script × LINE Messaging API</div>
    <h1>十大功能系統<br><span class="grad">完全實作手冊</span></h1>
    <p class="hero-sub">從 Webhook 設定到 GAS 程式碼，每個系統都有完整架構圖、逐步教學和可直接使用的程式碼。</p>
    <div class="stat-row">
      <div class="stat s-blue"><div class="stat-n">10</div><div class="stat-l">可部署系統</div></div>
      <div class="stat s-cyan"><div class="stat-n">3</div><div class="stat-l">創意獲利方案</div></div>
      <div class="stat s-green"><div class="stat-n">0元</div><div class="stat-l">基礎建置成本</div></div>
      <div class="stat s-pink"><div class="stat-n">GAS</div><div class="stat-l">無需伺服器</div></div>
    </div>
  </div>
</div>

<!-- INDEX GRID -->
<div class="idx-grid" id="idx-grid"></div>
</div>

<!-- SYSTEM PAGES (rendered by JS) -->
<div id="sys-container"></div>

<script>
// ============================================================
// SYSTEM DATA
// ============================================================
const systems = [
{
  id:1, icon:'🗓️', color:'#818CF8', bg:'rgba(79,70,229,.15)',
  name:'自動預約管理系統',
  short:'LINE訊息預約 → Sheet記錄 → 自動確認+提醒',
  tags:['t-blue','t-cyan','t-green'],tagNames:['預約管理','自動回覆','定時提醒'],
  creative:false,
  desc:'讓客戶直接在LINE上預約服務，GAS自動寫入Google Sheet、發送確認訊息，並在預約前一天自動推播提醒，完全取代人工接單。',
  flow:[
    {t:'用戶傳訊息',c:'n-user'},{t:'LINE Webhook',c:'n-line'},{t:'GAS處理',c:'n-gas'},
    {t:'寫入Sheet',c:'n-sheet'},{t:'回覆確認',c:'n-line'}
  ],
  steps:[
    {t:'建立 Google Sheet（預約資料庫）',d:'建立工作表，欄位：時間戳、LINE userId、姓名、電話、預約日期、服務項目、狀態（待確認/已確認/已完成/取消）'},
    {t:'LINE@ 官方帳號設定 Webhook URL',d:'在 LINE Developers Console → Messaging API → Webhook URL 填入 GAS 部署網址。啟用 Webhook，關閉自動回覆。'},
    {t:'GAS doPost() — 接收並解析訊息',d:'解析 LINE 傳來的 JSON，提取 userId、訊息文字，判斷是否符合預約格式（如「預約 12/25 14:00 剪髮」）'},
    {t:'GAS 寫入 Sheet + 回覆確認',d:'將預約資訊寫入 Sheet，同時呼叫 LINE Reply API 發送確認訊息含預約明細'},
    {t:'設定時間觸發器 — 每日早上9點執行提醒',d:'掃描 Sheet 中「明天」的預約，批次呼叫 LINE Push API 推播提醒訊息給對應的 userId'},
  ],
  code:`// ===== GAS 主程式 =====
const SHEET_ID = 'YOUR_SHEET_ID';
const LINE_TOKEN = 'YOUR_CHANNEL_ACCESS_TOKEN';

function doPost(e) {
  <span class="k">const</span> <span class="v">data</span> = JSON.parse(e.postData.contents);
  <span class="k">const</span> <span class="v">event</span> = data.events[<span class="n">0</span>];
  <span class="k">if</span> (!event || event.type !== <span class="s">'message'</span>) <span class="k">return</span>;

  <span class="k">const</span> <span class="v">userId</span> = event.source.userId;
  <span class="k">const</span> <span class="v">text</span> = event.message.text.trim();
  <span class="k">const</span> <span class="v">replyToken</span> = event.replyToken;

  <span class="c">// 解析預約格式：「預約 YYYY/MM/DD HH:MM 服務名稱」</span>
  <span class="k">const</span> <span class="v">match</span> = text.match(
    <span class="s">/^預約\s+(\d{1,2}\/\d{1,2})\s+(\d{2}:\d{2})\s+(.+)$/</span>
  );

  <span class="k">if</span> (match) {
    <span class="k">const</span> [_, date, time, service] = match;
    saveBooking(userId, date, time, service);
    replyMessage(replyToken,
      <span class="s">\`✅ 預約成功！\n📅 日期：\${date}\n⏰ 時間：\${time}\n💇 服務：\${service}\n\n如需取消請回覆「取消預約」\`</span>
    );
  } <span class="k">else if</span> (text === <span class="s">'取消預約'</span>) {
    cancelLatestBooking(userId);
    replyMessage(replyToken, <span class="s">'已取消您最近一筆預約。'</span>);
  } <span class="k">else</span> {
    replyMessage(replyToken,
      <span class="s">'📋 預約格式：\\n預約 月/日 時間 服務項目\\n例：預約 12/25 14:00 剪髮'</span>
    );
  }
}

<span class="f">function</span> <span class="n">saveBooking</span>(userId, date, time, service) {
  <span class="k">const</span> <span class="v">ss</span> = SpreadsheetApp.openById(SHEET_ID);
  <span class="k">const</span> <span class="v">sh</span> = ss.getSheetByName(<span class="s">'預約'</span>);
  sh.appendRow([<span class="k">new</span> Date(), userId, date, time, service, <span class="s">'已確認'</span>]);
}

<span class="c">// ===== 每日提醒（設定時間觸發器）=====</span>
<span class="f">function</span> <span class="n">sendDailyReminders</span>() {
  <span class="k">const</span> <span class="v">sh</span> = SpreadsheetApp.openById(SHEET_ID).getSheetByName(<span class="s">'預約'</span>);
  <span class="k">const</span> <span class="v">rows</span> = sh.getDataRange().getValues().slice(<span class="n">1</span>);
  <span class="k">const</span> <span class="v">tomorrow</span> = getTomorrowStr(); <span class="c">// 'MM/DD'</span>

  rows.forEach(row => {
    <span class="k">if</span> (row[<span class="n">2</span>] === tomorrow && row[<span class="n">5</span>] === <span class="s">'已確認'</span>) {
      pushMessage(row[<span class="n">1</span>], <span class="c">// userId</span>
        <span class="s">\`⏰ 明日預約提醒\n📅 \${row[2]} \${row[3]}\n💇 \${row[4]}\n請準時到場，謝謝！\`</span>
      );
    }
  });
}

<span class="f">function</span> <span class="n">replyMessage</span>(token, text) {
  UrlFetchApp.fetch(<span class="s">'https://api.line.me/v2/bot/message/reply'</span>, {
    method: <span class="s">'post'</span>, contentType: <span class="s">'application/json'</span>,
    headers: {Authorization: <span class="s">\`Bearer \${LINE_TOKEN}\`</span>},
    payload: JSON.stringify({replyToken: token, messages:[{type:<span class="s">'text'</span>,text}]})
  });
}

<span class="f">function</span> <span class="n">pushMessage</span>(userId, text) {
  UrlFetchApp.fetch(<span class="s">'https://api.line.me/v2/bot/message/push'</span>, {
    method: <span class="s">'post'</span>, contentType: <span class="s">'application/json'</span>,
    headers: {Authorization: <span class="s">\`Bearer \${LINE_TOKEN}\`</span>},
    payload: JSON.stringify({to: userId, messages:[{type:<span class="s">'text'</span>,text}]})
  });
}`,
  tips:['LINE@ 免費方案每月 500 則 Push 訊息，超過需升級', '可加入 Flex Message 做出漂亮的預約確認卡片', '建議加「查詢預約」指令讓用戶自助查看']
},
{
  id:2, icon:'🤖', color:'#06B6D4', bg:'rgba(6,182,212,.15)',
  name:'FAQ 智能客服機器人',
  short:'關鍵字比對 → 自動回覆 → 轉人工',
  tags:['t-cyan','t-blue'],tagNames:['客服自動化','關鍵字比對'],
  creative:false,
  desc:'從 Google Sheet 讀取 FAQ 資料庫，當用戶提問時自動比對關鍵字回覆答案，比對失敗時自動通知客服人員介入，7x24不停機。',
  flow:[
    {t:'用戶提問',c:'n-user'},{t:'LINE Webhook',c:'n-line'},{t:'GAS關鍵字比對',c:'n-gas'},
    {t:'FAQ Sheet',c:'n-sheet'},{t:'自動回覆/轉人工',c:'n-line'}
  ],
  steps:[
    {t:'建立 FAQ Google Sheet',d:'欄位：關鍵字（多個用逗號分隔）、回覆內容、分類。例：關鍵字「退貨,退款,換貨」→ 回覆退換貨政策說明'},
    {t:'GAS 讀取 FAQ 並建立比對邏輯',d:'將 Sheet 資料快取至 CacheService（每5分鐘更新），用戶訊息與每筆 FAQ 的關鍵字做包含比對'},
    {t:'分層回覆策略',d:'完全符合→直接回覆；部分符合→顯示最相關的3個問題供選擇；完全不符合→推送給管理員LINE帳號'},
    {t:'加入人工介入機制',d:'管理員收到通知後可直接在 LINE 回覆（使用特定前綴如「回:」），GAS 將訊息轉發給原用戶'},
    {t:'部署 Webhook 並測試',d:'用 Postman 模擬 LINE Webhook 測試各種情境，確認所有分支都能正確執行'},
  ],
  code:`<span class="c">// ===== FAQ 比對引擎 =====</span>
<span class="f">function</span> <span class="n">doPost</span>(e) {
  <span class="k">const</span> <span class="v">event</span> = JSON.parse(e.postData.contents).events[<span class="n">0</span>];
  <span class="k">if</span> (!event || event.type !== <span class="s">'message'</span>) <span class="k">return</span>;

  <span class="k">const</span> <span class="v">text</span> = event.message.text;
  <span class="k">const</span> <span class="v">userId</span> = event.source.userId;
  <span class="k">const</span> <span class="v">result</span> = matchFAQ(text);

  <span class="k">if</span> (result.type === <span class="s">'exact'</span>) {
    replyMessage(event.replyToken, result.answer);
  } <span class="k">else if</span> (result.type === <span class="s">'partial'</span>) {

<span class="f">function</span> <span class="n">matchFAQ</span>(text) {
  <span class="k">const</span> <span class="v">faqs</span> = getFAQFromCache();
  <span class="k">const</span> <span class="v">exact</span> = faqs.find(f =>
    f.keywords.some(k => text.includes(k))
  );
  <span class="k">if</span> (exact) <span class="k">return</span> {type: <span class="s">'exact'</span>, answer: exact.answer};

  <span class="c">// 部分相似：計算共同字符數</span>
  <span class="k">const</span> <span class="v">scored</span> = faqs.map(f => ({
    ...f,
    score: f.keywords.reduce((s,k) =>
      s + [...k].filter(c => text.includes(c)).length, <span class="n">0</span>)
  })).filter(f => f.score > <span class="n">0</span>)
     .sort((a,b) => b.score - a.score)
     .slice(<span class="n">0</span>,<span class="n">3</span>);

  <span class="k">if</span> (scored.length > <span class="n">0</span>)
    <span class="k">return</span> {type: <span class="s">'partial'</span>, matches: scored};
  <span class="k">return</span> {type: <span class="s">'none'</span>};
}

<span class="f">function</span> <span class="n">getFAQFromCache</span>() {
  <span class="k">const</span> <span class="v">cache</span> = CacheService.getScriptCache();
  <span class="k">let</span> <span class="v">data</span> = cache.get(<span class="s">'faq'</span>);
  <span class="k">if</span> (!data) {
    <span class="k">const</span> <span class="v">rows</span> = SpreadsheetApp.openById(SHEET_ID)
      .getSheetByName(<span class="s">'FAQ'</span>).getDataRange().getValues().slice(<span class="n">1</span>);
    <span class="k">const</span> <span class="v">faqs</span> = rows.map(r => ({
      keywords: r[<span class="n">0</span>].split(<span class="s">','</span>).map(k => k.trim()),
      answer: r[<span class="n">1</span>], title: r[<span class="n">2</span>]
    }));
    cache.put(<span class="s">'faq'</span>, JSON.stringify(faqs), <span class="n">300</span>);
    <span class="k">return</span> faqs;
  }
  <span class="k">return</span> JSON.parse(data);
}`,

  code:`<span class="f">function</span> <span class="n">doPost</span>(e) {

<span class="f">function</span> <span class="n">getDistance</span>(lat1, lon1, lat2, lon2) {
  <span class="c">// Haversine 公式計算兩點距離（公尺）</span>
  <span class="k">const</span> <span class="v">R</span> = <span class="n">6371000</span>;
  <span class="k">const</span> <span class="v">φ1</span> = lat1 * Math.PI/<span class="n">180</span>;
  <span class="k">const</span> <span class="v">φ2</span> = lat2 * Math.PI/<span class="n">180</span>;
  <span class="k">const</span> <span class="v">Δφ</span> = (lat2-lat1) * Math.PI/<span class="n">180</span>;
  <span class="k">const</span> <span class="v">Δλ</span> = (lon2-lon1) * Math.PI/<span class="n">180</span>;
  <span class="k">const</span> <span class="v">a</span> = Math.sin(Δφ/<span class="n">2</span>)**<span class="n">2</span> +
    Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/<span class="n">2</span>)**<span class="n">2</span>;
  <span class="k">return</span> R * <span class="n">2</span> * Math.atan2(Math.sqrt(a), Math.sqrt(<span class="n">1</span>-a));
}`,

  <span class="k">const</span> <span class="v">matched</span> = patterns.find(p => p.re.test(text));
  <span class="k">if</span> (!matched) {
    <span class="k">if</span> (text === <span class="s">'說明'</span>) {
      replyMessage(event.replyToken, getHelpText());
    } <span class="k">else if</span> (text === <span class="s">'月報'</span>) {
      generateMonthlyReport(userId, event.replyToken);
    }
    <span class="k">return</span>;
  }

  <span class="k">const</span> <span class="v">value</span> = matched.re.exec(text)[<span class="n">1</span>] || text;
  <span class="k">const</span> <span class="v">pet</span> = getPet(userId); <span class="c">// 取用戶的寵物資料</span>

  logHealth(userId, pet.name, matched.type, value);

  <span class="c">// 嘔吐異常提醒</span>
  <span class="k">if</span> (matched.type === <span class="s">'嘔吐'</span>) {
    replyMessage(event.replyToken,
      <span class="s">\`已記錄 \${pet.name} 嘔吐事件 😟\n如頻繁發生建議就醫。\n輸入「月報」可查看近期健康趨勢。\`</span>
    );
    <span class="k">return</span>;
  }

  replyMessage(event.replyToken,
    <span class="s">\`✅ 已記錄 \${pet.name} - \${matched.type}：\${value}\n📅 \${new Date().toLocaleString('zh-TW')}\`</span>
  );
}

<span class="c">// ===== AI月度報告生成 =====</span>
<span class="f">function</span> <span class="n">generateMonthlyReport</span>(userId, replyToken) {
  <span class="k">const</span> <span class="v">records</span> = getLastMonthRecords(userId);
  <span class="k">const</span> <span class="v">summary</span> = summarizeRecords(records); <span class="c">// 統計各類型數量/趨勢</span>

  <span class="k">const</span> <span class="v">prompt</span> = <span class="s">\`你是獸醫助理，根據以下寵物一個月的健康記錄，用溫暖的語氣給飼主一份健康摘要報告：
記錄摘要：\${JSON.stringify(summary)}
格式：整體評估（1句）、值得注意的事項（2-3點）、下個月建議（1-2點）
繁體中文，200字以內。\`</span>;

  <span class="k">const</span> <span class="v">report</span> = callOpenAI(prompt);
  replyMessage(replyToken,
    <span class="s">\`🐾 \${records[0].petName} 的月度健康報告\\n─────────────\\n\${report}\\n─────────────\\n完整數據請升級進階方案查看PDF報告\`</span>
  );
}`,
  tips:['台灣寵物市場規模超過 500 億，飼主付費意願高', '可加入「照片記錄」功能，接收寵物照片自動分類存入 Google Drive', '獸醫診所合作模式：診所向你購買授權，提供給客戶使用'],
  profit:{
    model:'訂閱 + B2B 診所授權',
    price:'個人版 NT$99/月，診所版 NT$3,980/月（100客戶）',
    cost:'GAS免費 + OpenAI月約NT$150（500用戶）',
    target:'台灣350萬寵物飼主（犬貓）',
    revenue:'5000訂閱者 × NT$99 + 20家診所 × NT$3,980 = 月收 NT$574,100',
    moat:'健康記錄數據積累越久用戶越難離開（轉換成本高）'
  }
}
];

// ============================================================
// RENDER INDEX
// ============================================================
function renderIndex() {
  const grid = document.getElementById('idx-grid');
  grid.innerHTML = systems.map(s => `
    <div class="idx-card ${s.creative?'creative':''}" onclick="showSystem(${s.id})">
      <div class="idx-icon" style="background:${s.bg}">${s.icon}</div>
      <div>
        <div class="idx-n">系統 ${String(s.id).padStart(2,'0')} ${s.creative?'<span class="creative-tag">💡 創意變現</span>':''}</div>
        <div class="idx-t">${s.name}</div>
        <div class="idx-d">${s.short}</div>
      </div>
    </div>
  `).join('');
}

// ============================================================
// RENDER SYSTEM PAGE
// ============================================================
function showSystem(id) {
  const s = systems.find(x=>x.id===id);
  document.getElementById('home-page').style.display='none';
  const container = document.getElementById('sys-container');

  const prevId = id > 1 ? id-1 : null;
  const nextId = id < systems.length ? id+1 : null;

  container.innerHTML = `
    <div class="sys-page active">
      <button class="back-btn" onclick="showHome()">← 返回總覽</button>

      <div class="sys-hero">
        <div class="sys-hero-bg">${s.icon}</div>
        <div class="sys-badge" style="background:${s.bg};color:${s.color}">
          系統 ${String(s.id).padStart(2,'0')} ${s.creative?'｜💡 創意變現':''}
        </div>
        <div class="sys-h1">${s.name}</div>
        <div class="sys-sub">${s.desc}</div>
        <div class="tag-row">
          ${s.tags.map((t,i)=>`<span class="tag ${t}">${s.tagNames[i]}</span>`).join('')}
        </div>
      </div>

      <!-- FLOW -->
      <div class="sec">
        <div class="sec-title">運作架構</div>
        <div class="flow">
          ${s.flow.map((n,i)=>`
            <div class="flow-node ${n.c}">${n.t}</div>
            ${i<s.flow.length-1?'<div class="flow-arr">→</div>':''}
          `).join('')}
        </div>
      </div>

      <!-- STEPS -->
      <div class="sec">
        <div class="sec-title">實作步驟</div>
        <div class="steps">
          ${s.steps.map((st,i)=>`
            <div class="step-item">
              <div class="step-left">
                <div class="step-num">${i+1}</div>
                ${i<s.steps.length-1?'<div class="step-line"></div>':''}
              </div>
              <div class="step-body">
                <div class="step-t">${st.t}</div>
                <div class="step-d">${st.d}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>

      <!-- CODE -->
      <div class="sec">
        <div class="sec-title">GAS 程式碼</div>
        <div class="code-block">
          <div class="code-header">
            <span class="code-lang">Google Apps Script (JavaScript)</span>
            <button class="copy-btn" onclick="copyCode(this)">複製</button>
          </div>
          <pre>${s.code}</pre>
        </div>
      </div>

      <!-- TIPS -->
      <div class="sec">
        <div class="sec-title">關鍵提醒</div>
        <div class="box box-tip">
          <div class="box-title">💡 實作注意事項</div>
          <ul>${s.tips.map(t=>`<li>${t}</li>`).join('')}</ul>
        </div>
      </div>

      ${s.profit ? `
      <!-- PROFIT -->
      <div class="sec">
        <div class="sec-title">商業模式分析</div>
        <div class="profit-card">
          <div class="profit-title">💰 獲利潛力評估</div>
          <div class="profit-grid">
            <div class="profit-item"><div class="profit-num" style="font-size:14px">${s.profit.model}</div><div class="profit-label">商業模式</div></div>
            <div class="profit-item"><div class="profit-num" style="font-size:13px">${s.profit.price}</div><div class="profit-label">定價策略</div></div>
            <div class="profit-item"><div class="profit-num" style="font-size:13px">${s.profit.cost}</div><div class="profit-label">每月成本</div></div>
            <div class="profit-item"><div class="profit-num" style="font-size:13px">${s.profit.revenue}</div><div class="profit-label">收入潛力</div></div>
          </div>
          <div class="box box-warn" style="margin-top:16px;">
            <div class="box-title">🎯 目標客群</div>
            <p>${s.profit.target}</p>
          </div>
          <div class="box box-ok" style="margin-top:8px;">
            <div class="box-title">🔒 競爭護城河</div>
            <p>${s.profit.moat}</p>
          </div>
        </div>
      </div>` : ''}

      <div class="sys-nav">
        ${prevId ? `<button class="btn btn-g" onclick="showSystem(${prevId})">← 系統 ${String(prevId).padStart(2,'0')}</button>` : '<div></div>'}
        ${nextId ? `<button class="btn btn-p" onclick="showSystem(${nextId})">系統 ${String(nextId).padStart(2,'0')} →</button>` : '<button class="btn btn-p" onclick="showHome()">回總覽</button>'}
      </div>
    </div>
  `;
  window.scrollTo(0,0);
}

function showHome() {
  document.getElementById('home-page').style.display='';
  document.getElementById('sys-container').innerHTML='';
  window.scrollTo(0,0);
}

function copyCode(btn) {
  const pre = btn.closest('.code-block').querySelector('pre');
  navigator.clipboard.writeText(pre.innerText).then(()=>{
    btn.textContent='已複製 ✓';
    setTimeout(()=>btn.textContent='複製',2000);
  });
}

// INIT
renderIndex();
</script>
</body>
</html>
