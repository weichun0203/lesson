<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技術分析型態學完全指南｜K線、反轉型態、整理型態、指標與量價</title>
<style>
:root{--primary:#4F46E5;--primary-dark:#3730A3;--secondary:#06B6D4;--accent:#F59E0B;--success:#10B981;--danger:#EF4444;--bg:#0F172A;--surface:#1E293B;--surface2:#334155;--text:#F1F5F9;--text-muted:#94A3B8;--border:#334155;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;overflow-x:hidden;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px;}

#app{display:flex;min-height:100vh;}
#sidebar{width:280px;min-width:280px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;transition:transform .3s;}
#main{margin-left:280px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
#topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
#content{flex:1;padding:40px 48px;max-width:900px;margin:0 auto;width:100%;}

.sidebar-header{padding:24px 20px 16px;border-bottom:1px solid var(--border);}
.sidebar-logo{font-size:13px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.sidebar-title{font-size:17px;font-weight:700;color:var(--text);line-height:1.3;}
.progress-bar-wrap{margin-top:12px;}
.progress-label{font-size:12px;color:var(--text-muted);margin-bottom:4px;display:flex;justify-content:space-between;}
.progress-bar{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--secondary));border-radius:2px;transition:width .5s;}
.chapter-list{padding:12px 0;}
.chapter-item{padding:10px 20px;cursor:pointer;border-left:3px solid transparent;transition:all .2s;display:flex;align-items:center;gap:10px;}
.chapter-item:hover{background:rgba(79,70,229,.12);border-left-color:var(--primary);}
.chapter-item.active{background:rgba(79,70,229,.2);border-left-color:var(--primary);}
.chapter-item.done .ch-num{background:var(--success)!important;}
.ch-num{width:24px;height:24px;border-radius:50%;background:var(--surface2);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-muted);}
.chapter-item.active .ch-num{background:var(--primary);color:#fff;}
.ch-info{flex:1;min-width:0;}
.ch-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ch-subtitle{font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.topbar-chapter{font-size:14px;font-weight:600;color:var(--text);}
.topbar-actions{display:flex;gap:8px;}
.btn{padding:7px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border);}
.btn-ghost:hover{background:var(--surface2);color:var(--text);}

.chapter-hero{background:linear-gradient(135deg,var(--surface) 0%,rgba(79,70,229,.15) 100%);border:1px solid var(--border);border-radius:16px;padding:36px;margin-bottom:36px;}
.chapter-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(79,70,229,.2);color:var(--primary);font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:12px;border:1px solid rgba(79,70,229,.3);}
.chapter-hero h1{font-size:28px;font-weight:800;margin-bottom:8px;line-height:1.3;}
.chapter-hero .desc{color:var(--text-muted);font-size:15px;max-width:640px;}
.chapter-hero .meta{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap;}
.meta-item{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);}
.meta-icon{font-size:16px;}

.section{margin-bottom:40px;}
.section-title{font-size:20px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:10px;color:var(--text);}
.section-title::before{content:'';width:4px;height:22px;background:linear-gradient(to bottom,var(--primary),var(--secondary));border-radius:2px;display:block;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:16px;}
.card-icon{font-size:28px;margin-bottom:10px;}
.card-title{font-weight:700;margin-bottom:6px;font-size:15px;}
.card-body{color:var(--text-muted);font-size:13px;line-height:1.6;}

.box{border-radius:10px;padding:16px 20px;margin-bottom:16px;border-left:4px solid;}
.box-info{background:rgba(6,182,212,.08);border-color:var(--secondary);color:#a5f3fc;}
.box-warning{background:rgba(245,158,11,.08);border-color:var(--accent);color:#fde68a;}
.box-success{background:rgba(16,185,129,.08);border-color:var(--success);color:#a7f3d0;}
.box-danger{background:rgba(239,68,68,.08);border-color:var(--danger);color:#fca5a5;}
.box-title{font-weight:700;font-size:13px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.box p,.box li{font-size:13px;line-height:1.7;}
.box ul{padding-left:16px;}

.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;margin:3px;}
.tag-blue{background:rgba(79,70,229,.2);color:#a5b4fc;}
.tag-cyan{background:rgba(6,182,212,.2);color:#67e8f9;}
.tag-green{background:rgba(16,185,129,.2);color:#6ee7b7;}
.tag-yellow{background:rgba(245,158,11,.2);color:#fcd34d;}
.tag-red{background:rgba(239,68,68,.2);color:#fca5a5;}

.table-wrap{overflow-x:auto;margin-bottom:16px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--surface2);padding:10px 14px;text-align:left;font-weight:700;color:var(--text);}
td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text-muted);}
tr:hover td{background:rgba(255,255,255,.03);}

.quiz-card{background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:24px;margin-top:32px;}
.quiz-header{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.quiz-badge{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;}
.quiz-title{font-size:16px;font-weight:700;}
.quiz-q{margin-bottom:20px;}
.quiz-q-text{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text);}
.quiz-options{display:flex;flex-direction:column;gap:8px;}
.quiz-opt{padding:10px 16px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:13px;transition:all .2s;background:transparent;color:var(--text);text-align:left;}
.quiz-opt:hover{border-color:var(--primary);background:rgba(79,70,229,.1);}
.quiz-opt.selected{border-color:var(--primary);background:rgba(79,70,229,.15);}
.quiz-opt.correct{border-color:var(--success);background:rgba(16,185,129,.15);color:#6ee7b7;}
.quiz-opt.wrong{border-color:var(--danger);background:rgba(239,68,68,.15);color:#fca5a5;}
.quiz-result{margin-top:20px;padding:16px;border-radius:8px;font-size:14px;display:none;}
.quiz-result.show{display:block;}
.quiz-result.pass{background:rgba(16,185,129,.1);border:1px solid var(--success);color:#6ee7b7;}
.quiz-result.fail{background:rgba(239,68,68,.1);border:1px solid var(--danger);color:#fca5a5;}
.quiz-score{font-size:24px;font-weight:800;margin-bottom:4px;}
.btn-quiz{margin-top:16px;background:var(--primary);color:#fff;border:none;padding:10px 24px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;}
.btn-quiz:hover{background:var(--primary-dark);}

.checklist{list-style:none;padding:0;}
.checklist li{padding:8px 0;display:flex;align-items:flex-start;gap:10px;font-size:14px;border-bottom:1px solid rgba(255,255,255,.05);}
.checklist li:last-child{border-bottom:none;}
.check-icon{color:var(--success);font-size:16px;flex-shrink:0;margin-top:1px;}

.steps{counter-reset:step;}
.step{display:flex;gap:16px;margin-bottom:20px;}
.step-num{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;color:#fff;}
.step-content{flex:1;}
.step-title{font-weight:700;margin-bottom:4px;font-size:15px;}
.step-desc{color:var(--text-muted);font-size:13px;}

.formula{background:var(--surface2);border-radius:10px;padding:16px 20px;font-family:monospace;font-size:15px;text-align:center;margin:16px 0;border:1px solid var(--border);color:var(--secondary);white-space:pre;}

.chapter-nav{display:flex;justify-content:space-between;margin-top:48px;padding-top:24px;border-top:1px solid var(--border);}

#sidebar-toggle{display:none;background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;}
@media(max-width:768px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #main{margin-left:0;}
  #content{padding:24px 20px;}
  #sidebar-toggle{display:block;}
  .chapter-hero h1{font-size:22px;}
  .card-grid{grid-template-columns:1fr;}
}

.accordion{margin-bottom:8px;}
.acc-header{padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;transition:all .2s;}
.acc-header:hover{border-color:var(--primary);}
.acc-header.open{border-radius:10px 10px 0 0;border-color:var(--primary);background:rgba(79,70,229,.1);}
.acc-body{background:var(--surface);border:1px solid var(--primary);border-top:none;border-radius:0 0 10px 10px;padding:0;max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s;}
.acc-body.open{padding:16px;max-height:1200px;}
.acc-arrow{transition:transform .3s;}
.acc-header.open .acc-arrow{transform:rotate(180deg);}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;}
.stat-num{font-size:32px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.stat-label{font-size:12px;color:var(--text-muted);margin-top:4px;}

.disclaimer{background:#0B1220;border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-top:32px;font-size:12px;color:var(--text-muted);}
.prereq{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:12px 16px;margin-bottom:24px;font-size:12.5px;color:#fde68a;display:flex;gap:8px;align-items:flex-start;}
.chart-demo{background:#0B1220;border:1px solid var(--border);border-radius:10px;padding:16px;margin:16px 0;}
.pattern-svg{width:100%;height:auto;display:block;}
.mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;}
.mini-card{background:#0B1220;border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center;}
.mini-card .cap{font-size:11px;color:var(--text-muted);margin-top:6px;}
</style>
</head>
<body>
<div id="app">

<nav id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">📐 技術分析型態學</div>
    <div class="sidebar-title">技術分析型態學完全指南<br>K線、反轉、整理、缺口、指標</div>
    <div class="progress-bar-wrap">
      <div class="progress-label"><span>閱讀進度</span><span id="progress-pct">0%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
  </div>
  <div class="chapter-list" id="chapter-list"></div>
</nav>

<div id="main">
  <div id="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <button id="sidebar-toggle" onclick="toggleSidebar()">☰</button>
      <span class="topbar-chapter" id="topbar-title">總覽</span>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost" onclick="prevChapter()">← 上一節</button>
      <button class="btn btn-primary" onclick="nextChapter()">下一節 →</button>
    </div>
  </div>
  <div id="content"></div>
</div>

</div>

<script>
const chapters = [
  { id:0, title:'總覽', subtitle:'為什麼要學型態學，以及怎麼用', icon:'🗺️', time:'5 分鐘', content: renderCh0 },
  { id:1, title:'K線型態基礎', subtitle:'單根K線與組合K線', icon:'🕯️', time:'20 分鐘', content: renderCh1 },
  { id:2, title:'反轉型態', subtitle:'頭肩頂/底、雙頂/雙底、三重頂/底、圓弧、V型', icon:'🔄', time:'24 分鐘', content: renderCh2 },
  { id:3, title:'整理型態', subtitle:'三角收斂、旗形、楔形、矩形、杯柄型', icon:'📐', time:'22 分鐘', content: renderCh3 },
  { id:4, title:'缺口理論', subtitle:'普通缺口、突破缺口、逃逸缺口、竭盡缺口', icon:'🕳️', time:'14 分鐘', content: renderCh4 },
  { id:5, title:'動能與震盪指標', subtitle:'RSI、MACD、KD、布林通道', icon:'📡', time:'22 分鐘', content: renderCh5 },
  { id:6, title:'量價關係與型態確認', subtitle:'成交量如何驗證型態的可信度', icon:'📊', time:'16 分鐘', content: renderCh6 },
  { id:7, title:'型態失敗與風險管理', subtitle:'假突破、停損設定、部位控管', icon:'🛑', time:'16 分鐘', content: renderCh7 },
  { id:8, title:'實戰整合與總複習', subtitle:'型態速查表與檢查清單', icon:'📋', time:'18 分鐘', content: renderCh8 }
];

let currentChapter = 0;
let completedChapters = new Set();
try { completedChapters = new Set(JSON.parse(localStorage.getItem('ta_patterns_done')||'[]')); } catch(e){}

function renderSidebar(){
  const list = document.getElementById('chapter-list');
  list.innerHTML = chapters.map(ch=>`
    <div class="chapter-item ${ch.id===currentChapter?'active':''} ${completedChapters.has(ch.id)?'done':''}"
         onclick="goChapter(${ch.id})">
      <div class="ch-num">${completedChapters.has(ch.id)?'✓':ch.id}</div>
      <div class="ch-info">
        <div class="ch-title">${ch.icon} ${ch.title}</div>
        <div class="ch-subtitle">${ch.subtitle}</div>
      </div>
    </div>
  `).join('');
  const pct = Math.round(completedChapters.size/chapters.length*100);
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('progress-pct').textContent = pct+'%';
}

function goChapter(id){
  completedChapters.add(currentChapter);
  try { localStorage.setItem('ta_patterns_done', JSON.stringify([...completedChapters])); } catch(e){}
  currentChapter = id;
  renderSidebar();
  document.getElementById('topbar-title').textContent = chapters[id].icon+' '+chapters[id].title;
  document.getElementById('content').innerHTML = chapters[id].content();
  window.scrollTo(0,0);
  initQuizzes();
  document.getElementById('sidebar').classList.remove('open');
}

function nextChapter(){ if(currentChapter<chapters.length-1) goChapter(currentChapter+1); }
function prevChapter(){ if(currentChapter>0) goChapter(currentChapter-1); }
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); }

function initQuizzes(){
  document.querySelectorAll('.quiz-opt').forEach(btn=>{
    btn.addEventListener('click',function(){
      const q = this.closest('.quiz-q');
      if(q.dataset.answered) return;
      q.dataset.answered='1';
      const correct = this.dataset.correct==='1';
      this.classList.add(correct?'correct':'wrong');
      if(!correct){
        q.querySelectorAll('.quiz-opt[data-correct="1"]').forEach(b=>b.classList.add('correct'));
      }
      const card = this.closest('.quiz-card');
      const all = card.querySelectorAll('.quiz-q');
      const done = card.querySelectorAll('.quiz-q[data-answered]');
      if(done.length===all.length) showQuizResult(card);
    });
  });
  document.querySelectorAll('.btn-quiz').forEach(btn=>{
    btn.addEventListener('click',function(){
      const card = this.closest('.quiz-card');
      card.querySelectorAll('.quiz-q').forEach(q=>{
        delete q.dataset.answered;
        q.querySelectorAll('.quiz-opt').forEach(o=>{
          o.classList.remove('correct','wrong','selected');
        });
      });
      card.querySelector('.quiz-result').classList.remove('show','pass','fail');
    });
  });
}
function showQuizResult(card){
  const correct = card.querySelectorAll('.quiz-opt.correct').length;
  const total = card.querySelectorAll('.quiz-q').length;
  const res = card.querySelector('.quiz-result');
  const pass = correct/total>=0.6;
  res.innerHTML = `<div class="quiz-score">${correct}/${total} 題正確</div>
    <div>${pass?'🎉 恭喜通過！你已掌握本節核心概念。':'💪 再複習一下，重新挑戰！'}</div>`;
  res.classList.add('show', pass?'pass':'fail');
}
function accToggle(el){
  el.classList.toggle('open');
  el.nextElementSibling.classList.toggle('open');
}

// ============================================================
// 0: 總覽
// ============================================================
function renderCh0(){
return `
<div class="chapter-hero">
  <div class="chapter-badge">🗺️ 總覽</div>
  <h1>技術分析型態學完全指南<br>K線、反轉型態、整理型態、缺口與指標</h1>
  <p class="desc">這份指南把技術分析中最核心的「型態辨識」能力，從K線基礎一路延伸到動能指標與量價確認，並附上大量圖示，幫助你建立系統化的圖表判讀能力。</p>
  <div class="meta">
    <div class="meta-item"><span class="meta-icon">⏱️</span>總閱讀時間：約 2.5 小時</div>
    <div class="meta-item"><span class="meta-icon">📚</span>9 個章節</div>
    <div class="meta-item"><span class="meta-icon">🎯</span>適合已有基礎、想系統化整理技術分析知識者</div>
  </div>
</div>

<div class="box box-warning">
  <div class="box-title">⚠️ 使用本指南前的心理建設</div>
  <p>技術分析反映的是「過去」的價格與成交量行為模式，並不能保證「未來」會重複相同的走勢。任何型態或指標都可能失敗，本指南的目的是幫助你建立辨識能力與風險意識，不構成投資建議，也不保證任何交易績效。技術分析建議搭配基本面分析與嚴謹的風險管理一起使用，而非單獨作為交易依據。</p>
</div>

<div class="section">
  <div class="section-title">內容地圖</div>
  <div class="steps">
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-content">
        <div class="step-title">🕯️ K線基礎（第1章）</div>
        <div class="step-desc">從單根K線的意義，到常見的多根K線組合型態，這是所有技術分析的最小單位。</div>
      </div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div class="step-content">
        <div class="step-title">🔄📐 型態學核心（第2-3章）</div>
        <div class="step-desc">反轉型態告訴你趨勢可能要變盤了，整理型態告訴你市場正在盤整蓄力，這是本指南份量最重的部分。</div>
      </div>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div class="step-content">
        <div class="step-title">🕳️ 缺口理論（第4章）</div>
        <div class="step-desc">價格跳空留下的缺口，往往透露出市場情緒的線索。</div>
      </div>
    </div>
    <div class="step">
      <div class="step-num">4</div>
      <div class="step-content">
        <div class="step-title">📡📊 指標與量價（第5-6章）</div>
        <div class="step-desc">用RSI、MACD、KD、布林通道等指標，搭配成交量，交叉驗證型態的可信度。</div>
      </div>
    </div>
    <div class="step">
      <div class="step-num">5</div>
      <div class="step-content">
