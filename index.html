<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>內容資源中心｜投資理財 × 行銷企劃 × 影音創作 × 攝影 × GAS 教學</title>
    <meta name="description" content="內容資源中心總覽：投資理財入門與課程地圖、行銷企劃書指南、短影音策略與剪輯 SOP、攝影入門指南、問卷調查課程、Google Apps Script（GAS）開發教學，一站找到所有學習資源。">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="內容資源中心｜投資理財 × 行銷企劃 × 影音創作 × 攝影 × GAS 教學">
    <meta property="og:description" content="投資理財、行銷企劃、短影音創作、攝影入門、問卷調查、Google Apps Script 教學等課程總覽，依分類快速找到你需要的內容。">

    <!-- Structured Data: ItemList (由下方 courses 陣列同步產生，若手動改動陣列記得同步更新此區塊) -->
    <script type="application/ld+json" id="ldjson">
    {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "name": "內容資源中心課程列表",
      "itemListElement": []
    }
    </script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin-bottom: 28px;
            max-width: 640px;
        }
        h1 {
            font-size: 2.1rem;
            margin-bottom: 10px;
            color: #fff;
        }
        header p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
        }

        /* Search */
        .search-wrap {
            width: 100%;
            max-width: 480px;
            margin-bottom: 24px;
            position: relative;
        }
        .search-wrap input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.12);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .search-wrap input:focus {
            border-color: var(--accent-color);
        }
        .search-wrap input::placeholder {
            color: var(--text-muted);
        }
        .search-wrap .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            font-size: 0.95rem;
        }

        /* Category filter tabs */
        nav.filters {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 36px;
            max-width: 900px;
        }
        .filter-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            padding: 10px 18px;
            min-height: 44px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .filter-btn:hover {
            color: var(--text-color);
            border-color: var(--accent-color);
        }
        .filter-btn.active {
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: 600;
            border-color: var(--accent-color);
        }
        .filter-btn .count {
            font-size: 0.78rem;
            opacity: 0.75;
        }

        main {
            width: 100%;
            max-width: 900px;
            padding-bottom: 40px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            text-decoration: none;
            color: var(--text-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: block;
        }
        .card:hover {
            transform: translateY(-4px);
            background-color: #273548;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border-color: var(--accent-color);
        }
        .card.hidden {
            display: none;
        }
        .card .tag {
            display: inline-block;
            font-size: 0.7rem;
            color: var(--accent-color);
            background: rgba(56, 189, 248, 0.12);
            padding: 2px 10px;
            border-radius: 999px;
            margin-bottom: 10px;
        }
        .card h2 {
            margin: 0 0 8px 0;
            font-size: 1.2rem;
            color: var(--accent-color);
        }
        .card p.desc {
            margin: 0 0 10px 0;
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .card span.filename {
            font-size: 0.85rem;
            color: var(--text-muted);
            word-break: break-all;
        }
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
        }

        /* CTA footer */
        .cta {
            width: 100%;
            background-color: var(--card-bg);
            border-top: 1px solid rgba(255,255,255,0.08);
            padding: 36px 20px;
            text-align: center;
        }
        .cta h2 {
            margin: 0 0 8px 0;
            font-size: 1.3rem;
            color: #fff;
        }
        .cta p {
            color: var(--text-muted);
            margin: 0 0 18px 0;
        }
        .cta a.cta-btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 999px;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }
        .cta a.cta-btn:hover {
            background-color: var(--accent-hover);
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.6rem; }
            .filter-btn { font-size: 0.85rem; padding: 9px 14px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>內容資源中心</h1>
        <p>投資理財、行銷企劃、短影音創作、攝影、問卷調查與 Google Apps Script（GAS）開發教學，依分類或關鍵字快速找到你需要的內容。</p>
    </header>

    <div class="search-wrap">
        <span class="icon" aria-hidden="true">🔍</span>
        <input type="text" id="searchInput" placeholder="搜尋課程名稱或關鍵字..." aria-label="搜尋課程">
    </div>

    <nav class="filters" id="filters" aria-label="課程分類篩選"></nav>

    <main>
        <div class="container" id="cardContainer"></div>
    </main>

    <section class="cta">
        <h2>有問題想直接詢問？</h2>
        <p>歡迎透過官方管道聯繫我們，取得更完整的課程建議。</p>
        <a href="#" class="cta-btn">立即聯繫</a>
    </section>

    <script>
        /* ============================================================
           課程資料陣列
           之後要新增課程，只要在這裡新增一筆物件即可，
           分類篩選按鈕、卡片、搜尋、結構化資料(JSON-LD)都會自動產生。

           category: 分類代碼（用來篩選，同代碼會歸在同一個 tab）
           categoryLabel: 分類顯示文字（tag 上顯示的文字 + filter 按鈕文字）
           title: 課程標題
           desc: 課程簡介
           url: 連結的檔名
           ============================================================ */
        const courses = [
            {
                category: 'tech',
                categoryLabel: '技術工具',
                title: 'Google Apps Script 開發教學',
                desc: 'GAS（Google Apps Script）自動化與系統整合教學。',
                url: 'gas_line_systems.html'
            },
            {
                category: 'invest',
                categoryLabel: '投資理財',
                title: '投資小白入門課程',
                desc: '專為零基礎新手設計的基礎理財觀念與建立。',
                url: 'invest-starter.html'
            },
            {
                category: 'invest',
                categoryLabel: '投資理財',
                title: '投資初級課程',
                desc: '從零開始認識投資的基本觀念與準備事項。',
                url: 'invest-begin.html'
            },
            {
                category: 'invest',
                categoryLabel: '投資理財',
                title: '投資中級課程',
                desc: '進階投資策略、工具應用與市場分析技巧。',
                url: 'invest-inter.html'
            },
            {
                category: 'invest',
                categoryLabel: '投資理財',
                title: '投資高級課程',
                desc: '高階財務管理、資產配置規劃與深度市場研究。',
                url: 'invest-adv.html'
            },
            {
                category: 'invest',
                categoryLabel: '投資理財',
                title: '投資專業級課程',
                desc: '專業級操盤手實戰解析、進階風險控管與總經分析。',
                url: 'invest-pro.html'
            },
            {
                category: 'invest',
                categoryLabel: '投資理財',
                title: '投資課程地圖',
                desc: '投資課程整體架構與學習路徑地圖。',
                url: 'invest_course_map.html'
            },
            {
                category: 'invest',
                categoryLabel: '投資理財',
                title: '個人理財補充篇',
                desc: '補充個人理財觀念與實務應用，強化基礎財務規劃能力。',
                url: 'personal-finance.html'
            },
            {
                category: 'invest',
                categoryLabel: '投資理財',
                title: '價格行為學指南',
                desc: '透過價格走勢本身判讀市場心理與趨勢的分析方法。',
                url: 'price-action.html'
            },
            {
                category: 'invest',
                categoryLabel: '投資理財',
                title: '技術分析型態學完全指南',
                desc: '系統化整理各類技術分析圖形型態與應用時機。',
                url: 'chart-patterns.html'
            },
            {
                category: 'marketing',
                categoryLabel: '行銷內容',
                title: '行銷企劃書指南',
                desc: '如何撰寫一份完整且具說服力的行銷企劃書。',
                url: 'marketing-plan-guide.html'
            },
            {
                category: 'video',
                categoryLabel: '影音創作',
                title: '短影音策略',
                desc: '短影音內容規劃與經營策略。',
                url: 'shorts_strategy.html'
            },
            {
                category: 'survey',
                categoryLabel: '問卷調查',
                title: '問卷調查課程',
                desc: '問卷設計與調查方法教學。',
                url: 'survey_course.html'
            },
            {
                category: 'video',
                categoryLabel: '影音創作',
                title: '影片剪輯 SOP',
                desc: '標準化影片剪輯流程與作業規範。',
                url: 'video-editing-sop.html'
            },
            {
                category: 'video',
                categoryLabel: '影音創作',
                title: '短影音鉤子設計課程',
                desc: '如何設計吸引觀眾停留的開頭鉤子。',
                url: 'video-hook-design-course.html'
            },
            {
                category: 'photography',
                categoryLabel: '攝影',
                title: '攝影入門完全指南',
                desc: '從看懂相機到拍出好照片，攝影新手必讀的入門完全指南。',
                url: 'photography-begin.html'
            },
            {
                category: 'video',
                categoryLabel: '影音創作',
                title: '影片剪輯完全指南',
                desc: '從前期規劃到上片檢查，拆解文字、聲音、字幕、顏色、節奏、敘事六大核心面向，附具體秒數公式，不再只靠感覺剪片。',
                url: 'video-editing-complete-guide.html'
            }
        ];

        // 分類顯示順序（新分類會自動排在最後）
        const categoryOrder = ['invest', 'marketing', 'video', 'photography', 'survey', 'tech'];

        const filtersNav = document.getElementById('filters');
        const container = document.getElementById('cardContainer');
        const searchInput = document.getElementById('searchInput');

        // ---- 產生 JSON-LD 結構化資料 ----
        function buildJsonLd() {
            const ld = {
                "@context": "https://schema.org",
                "@type": "ItemList",
                "name": "內容資源中心課程列表",
                "itemListElement": courses.map((c, i) => ({
                    "@type": "ListItem",
                    "position": i + 1,
                    "name": c.title,
                    "url": c.url
                }))
            };
            document.getElementById('ldjson').textContent = JSON.stringify(ld, null, 2);
        }

        // ---- 產生分類篩選按鈕 ----
        function buildFilters() {
            const categories = [...new Set(courses.map(c => c.category))];
            categories.sort((a, b) => {
                const ia = categoryOrder.indexOf(a);
                const ib = categoryOrder.indexOf(b);
                if (ia === -1 && ib === -1) return 0;
                if (ia === -1) return 1;
                if (ib === -1) return -1;
                return ia - ib;
            });

            const labelMap = {};
            courses.forEach(c => { labelMap[c.category] = c.categoryLabel; });

            let html = `<button class="filter-btn active" data-filter="all">全部 <span class="count" data-count-for="all"></span></button>`;
            categories.forEach(cat => {
                html += `<button class="filter-btn" data-filter="${cat}">${labelMap[cat]} <span class="count" data-count-for="${cat}"></span></button>`;
            });
            filtersNav.innerHTML = html;
        }

        // ---- 產生課程卡片 ----
        function buildCards() {
            container.innerHTML = courses.map(c => `
                <a href="${c.url}" class="card" data-category="${c.category}">
                    <span class="tag">${c.categoryLabel}</span>
                    <h2>${c.title}</h2>
                    <p class="desc">${c.desc}</p>
                    <span class="filename">${c.url}</span>
                </a>
            `).join('');
        }

        // ---- 更新每個分類的數量 ----
        function updateCounts() {
            const cards = document.querySelectorAll('.card');
            const counts = { all: cards.length };
            cards.forEach(card => {
                const cat = card.dataset.category;
                counts[cat] = (counts[cat] || 0) + 1;
            });
            document.querySelectorAll('[data-count-for]').forEach(el => {
                const key = el.dataset.countFor;
                el.textContent = counts[key] ? `(${counts[key]})` : '(0)';
            });
        }

        function getActiveFilter() {
            const activeBtn = document.querySelector('.filter-btn.active');
            return activeBtn ? activeBtn.dataset.filter : 'all';
        }

        function applyFilters() {
            const filter = getActiveFilter();
            const keyword = searchInput.value.trim().toLowerCase();
            const cards = document.querySelectorAll('.card');
            let visibleCount = 0;

            cards.forEach(card => {
                const matchesCategory = filter === 'all' || card.dataset.category === filter;
                const text = card.textContent.toLowerCase();
                const matchesKeyword = keyword === '' || text.includes(keyword);
                const show = matchesCategory && matchesKeyword;
                card.classList.toggle('hidden', !show);
                if (show) visibleCount++;
            });

            let emptyState = container.querySelector('.empty-state');
            if (visibleCount === 0) {
                if (!emptyState) {
                    emptyState = document.createElement('div');
                    emptyState.className = 'empty-state';
                    container.appendChild(emptyState);
                }
                emptyState.textContent = keyword
                    ? `找不到符合「${searchInput.value.trim()}」的內容`
                    : '此分類目前沒有內容';
            } else if (emptyState) {
                emptyState.remove();
            }
        }

        function bindFilterButtons() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    const filter = btn.dataset.filter;
                    const url = new URL(window.location);
                    if (filter === 'all') {
                        url.searchParams.delete('category');
                    } else {
                        url.searchParams.set('category', filter);
                    }
                    history.pushState({}, '', url);

                    applyFilters();
                });
            });
        }

        // 頁面載入時，依網址上的 category 參數還原篩選狀態
        function restoreFromURL() {
            const params = new URLSearchParams(window.location.search);
            const category = params.get('category');
            if (category) {
                const targetBtn = document.querySelector(`.filter-btn[data-filter="${category}"]`);
                if (targetBtn) {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    targetBtn.classList.add('active');
                }
            }
            applyFilters();
        }

        // ---- 初始化 ----
        buildJsonLd();
        buildFilters();
        buildCards();
        updateCounts();
        bindFilterButtons();
        searchInput.addEventListener('input', applyFilters);
        restoreFromURL();

        window.addEventListener('popstate', restoreFromURL);
    </script>
</body>
</html>
